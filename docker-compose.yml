x-spring-environment: &spring-environment
  KEYCLOAK_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL:-http://${PUBLIC_BACKEND_HOST:-localhost}:${KEYCLOAK_PORT:-8080}}

services:
  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: config-service
    ports:
      - "${CONFIG_SERVICE_PORT:-8888}:8888"
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-service:/app
      - ./config-repo:/config-repo:ro
      - ~/.m2:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-plaid:
    image: postgres:15
    container_name: postgres-plaid
    env_file: config/.postgres-plaid-adapter
    ports:
      - "${POSTGRES_PLAID_PORT}:5432"
    volumes:
      - postgres-plaid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-insights-inbox:
    image: postgres:15
    container_name: postgres-insights-inbox
    env_file: config/.postgres-insights-inbox
    ports:
      - "${POSTGRES_INSIGHTS_INBOX_PORT}:5432"
    volumes:
      - postgres-insights-inbox-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    env_file: config/.postgres-keycloak
    ports:
      - "${POSTGRES_KEYCLOAK_PORT}:5432"
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-account:
    image: postgres:15
    container_name: postgres-account
    env_file: config/.postgres-account
    ports:
      - "${POSTGRES_ACCOUNT_PORT}:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-transaction:
    image: postgres:15
    container_name: postgres-transaction
    env_file: config/.postgres-transaction
    ports:
      - "${POSTGRES_TRANSACTION_PORT}:5432"
    volumes:
      - postgres-transaction-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-budgeting:
    image: postgres:15
    container_name: postgres-budgeting
    env_file: config/.postgres-budgeting
    ports:
      - "${POSTGRES_BUDGETING_PORT}:5432"
    volumes:
      - postgres-budgeting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ai-assistant:
    image: postgres:15
    container_name: postgres-ai-assistant
    env_file: config/.postgres-ai-assistant
    ports:
      - "${POSTGRES_AI_ASSISTANT_PORT}:5432"
    volumes:
      - postgres-ai-assistant-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    command: start-dev
    env_file: config/.keycloak
    environment:
      KC_HOSTNAME: ${PUBLIC_BACKEND_HOST:-localhost}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak/themes/wallet-hub:/opt/keycloak/themes/wallet-hub:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  plaid-adapter-service:
    build:
      context: .
      dockerfile: plaid-adapter-service/Dockerfile
    container_name: plaid-adapter-service
    env_file:
      - config/.spring-common
      - config/.plaid-adapter
    environment:
      <<: *spring-environment
    ports:
      - "${PLAID_SERVICE_PORT}:8082"
    depends_on:
      config-service:
        condition: service_healthy
      postgres-plaid:
        condition: service_healthy
    volumes:
      - ./plaid-adapter-service:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    env_file:
      - config/.spring-common
      - config/.account
    environment:
      <<: *spring-environment
    ports:
      - "${ACCOUNT_SERVICE_PORT}:8083"
    depends_on:
      config-service:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./account-service:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: transaction-service
    env_file:
      - config/.spring-common
      - config/.transaction-service
    environment:
      <<: *spring-environment
    ports:
      - "${TRANSACTION_SERVICE_PORT}:8086"
    depends_on:
      config-service:
        condition: service_healthy
      postgres-transaction:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./transaction-service:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2

  insights-service:
    build:
      context: .
      dockerfile: insights-service/Dockerfile
    container_name: insights-service
    env_file:
      - config/.spring-common
      - config/.insights-service
    environment:
      <<: *spring-environment
    ports:
      - "${INSIGHTS_SERVICE_PORT}:8084"
    depends_on:
      config-service:
        condition: service_healthy
      clickhouse-insights:
        condition: service_healthy
      postgres-insights-inbox:
        condition: service_healthy
    #  rabbitmq:
  #      condition: service_healthy
    volumes:
      - ./insights-service:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2

  budgeting-service:
    build:
      context: .
      dockerfile: budgeting/Dockerfile
    container_name: budgeting-service
    env_file:
      - config/.spring-common
      - config/.budgeting
    environment:
      <<: *spring-environment
    ports:
      - "${BUDGETING_SERVICE_PORT}:8089"
    depends_on:
      config-service:
        condition: service_healthy
      postgres-budgeting:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./budgeting:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2

  dashboard-service:
    build:
      context: .
      dockerfile: dashboard-service/Dockerfile
    container_name: dashboard-service
    env_file:
      - config/.spring-common
      - config/.dashboard
    environment:
      <<: *spring-environment
    ports:
      - "${DASHBOARD_SERVICE_PORT}:8090"
    depends_on:
      config-service:
        condition: service_healthy
    volumes:
      - ./dashboard-service:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2

  ai-assistant-service:
    build:
      context: .
      dockerfile: ai-assistant/Dockerfile
    container_name: ai-assistant-service
    env_file:
      - config/.spring-common
      - config/.ai-assistant
    environment:
      <<: *spring-environment
    ports:
      - "${AI_ASSISTANT_SERVICE_PORT}:8091"
    volumes:
      - ./ai-assistant:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2
    depends_on:
      config-service:
        condition: service_healthy
      postgres-ai-assistant:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clickhouse-insights:
    image: clickhouse/clickhouse-server:26.2
    container_name: clickhouse-insights
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    env_file: config/.clickhouse-insights
    volumes:
      - clickhouse-insights-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - config/.spring-common
      - config/.api-gateway
    environment:
      <<: *spring-environment
    ports:
      - "${API_GATEWAY_PORT}:8085"
    volumes:
      - ./api-gateway:/app
      - ./shared:/shared
      - ~/.m2:/root/.m2
    depends_on:
      config-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: grafana-lgtm
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${PROMETHEUS_PORT:-9090}:9090"
      - "${LOKI_PORT:-3100}:3100"
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./observability/grafana/provisioning:/otel-lgtm/grafana/conf/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-plaid-data:
  postgres-keycloak-data:
  postgres-transaction-data:
  postgres-budgeting-data:
  postgres-account-data:
  postgres-ai-assistant-data:
  postgres-insights-inbox-data:
  maven-repo:
  rabbitmq-data:
  clickhouse-insights-data:
  ollama-data:
  
