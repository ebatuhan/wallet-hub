spring:
  application:
    name: transaction-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/transaction_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/certs

      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: transaction-service
            client-secret: nWXtEyXO1hLTU1XfQYuLn74qHDoQjmMv
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            # Note: For client credentials, we use the token-uri
            token-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/token


  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create

server:
  port: ${TRANSACTION_SERVICE_PORT:8086}

accountclient:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}/accounts

