spring:
  application:
    name: plaid-adapter-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/plaid_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: plaid-adapter-service
            client-secret: BeFZtmL7fXpYG7QsOJdIQ6voP71alW1z
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/token



  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: create

server:
  port: ${PLAID_SERVICE_PORT:8082}

plaid:
  api: ${PLAID_API_ID:68f013c09bda9e001fac9053}
  secret: ${PLAID_API_SECRET:2a1cf9a2fc0dfb5152c552709accfc}
  env: ${PLAID_ENV_TYPE:sandbox}
  webhook:
   url: ${PLAID_WEBHOOK_URL:https://71l6b2-2a0b-4140-ab40--2.ru.tuna.am/api/plaid/webhook}

accountclient:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}/accounts

transactionclient:
  url: ${TRANSACTION_SERVICE_URL:http://localhost:8086}/transactions