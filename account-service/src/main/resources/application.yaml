spring:
  application:
    name: account-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/account_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/certs

  sql:
    init:
      mode: always

  jpa:

    defer-datasource-initialization: true 

    show-sql: true
    properties:
      hibernate:
      format_sql: true
    
    hibernate:
      ddl-auto: none
server:
  port: ${ACCOUNT_SERVICE_PORT:8083}