spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service-route
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/accounts,/api/accounts/**
              filters:
                - StripPrefix=1

            - id: transaction-service-route
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/transactions,/api/transactions/**
              filters:
                - StripPrefix=1

            - id: plaid-adapter-service-route
              uri: ${PLAID_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/plaid,/api/plaid/**
              filters:
                - StripPrefix=1

            - id: plaid-connections-route
              uri: ${PLAID_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/connections,/api/connections/**
              filters:
                - StripPrefix=1
                - PrefixPath=/plaid

            - id: insights-service-route
              uri: ${INSIGHTS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/insights,/api/insights/**

            - id: budgeting-service-route
              uri: ${BUDGETING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/budgets,/api/budgets/**
              filters:
                - StripPrefix=1

            - id: dashboard-service-route
              uri: ${DASHBOARD_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/dashboard,/api/dashboard/**
              filters:
                - StripPrefix=1

            - id: ai-assistant-service-route
              uri: ${AI_ASSISTANT_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/assistant,/api/assistant/**
              filters:
                - StripPrefix=1

            - id: account-service-openapi
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/openapi/account-service
              filters:
                - RewritePath=/openapi/account-service, /v3/api-docs

            - id: transaction-service-openapi
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/openapi/transaction-service
              filters:
                - RewritePath=/openapi/transaction-service, /v3/api-docs

            - id: plaid-adapter-service-openapi
              uri: ${PLAID_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/openapi/plaid-adapter-service
              filters:
                - RewritePath=/openapi/plaid-adapter-service, /v3/api-docs

            - id: insights-service-openapi
              uri: ${INSIGHTS_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/openapi/insights-service
              filters:
                - RewritePath=/openapi/insights-service, /v3/api-docs

            - id: budgeting-service-openapi
              uri: ${BUDGETING_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/openapi/budgeting-service
              filters:
                - RewritePath=/openapi/budgeting-service, /v3/api-docs

            - id: dashboard-service-openapi
              uri: ${DASHBOARD_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/openapi/dashboard-service
              filters:
                - RewritePath=/openapi/dashboard-service, /v3/api-docs

            - id: ai-assistant-service-openapi
              uri: ${AI_ASSISTANT_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/openapi/ai-assistant-service
              filters:
                - RewritePath=/openapi/ai-assistant-service, /v3/api-docs

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Account Service
        url: /openapi/account-service
      - name: Transaction Service
        url: /openapi/transaction-service
      - name: Plaid Adapter Service
        url: /openapi/plaid-adapter-service
      - name: Insights Service
        url: /openapi/insights-service
      - name: Budgeting Service
        url: /openapi/budgeting-service
      - name: Dashboard Service
        url: /openapi/dashboard-service
      - name: AI Assistant Service
        url: /openapi/ai-assistant-service

wallet-hub:
  security:
    jwt:
      audience: ${WALLET_HUB_API_AUDIENCE:wallet-hub-api}

server:
  port: 8085
