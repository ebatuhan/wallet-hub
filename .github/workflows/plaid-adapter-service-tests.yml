name: Plaid Adapter Service Tests

on:
  pull_request:
    paths:
      - "services/plaid-adapter-service/**"
      - "services/shared/**"
      - ".github/workflows/plaid-adapter-service-tests.yml"
  push:
    branches:
      - dev
    paths:
      - "services/plaid-adapter-service/**"
      - "services/shared/**"
      - ".github/workflows/plaid-adapter-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test plaid adapter service
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install shared module
        run: mvn --batch-mode --no-transfer-progress -f services/shared/pom.xml clean install

      - name: Verify plaid adapter service
        run: mvn --batch-mode --no-transfer-progress -f services/plaid-adapter-service/pom.xml clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plaid-adapter-service-surefire-reports
          path: services/plaid-adapter-service/target/surefire-reports/
          if-no-files-found: error

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plaid-adapter-service-failsafe-reports
          path: services/plaid-adapter-service/target/failsafe-reports/
          if-no-files-found: error

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plaid-adapter-service-jacoco-reports
          path: |
            services/plaid-adapter-service/target/site/jacoco/
            services/plaid-adapter-service/target/site/jacoco-it/
          if-no-files-found: error
