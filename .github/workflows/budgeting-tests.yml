name: Budgeting Service Tests

on:
  pull_request:
    paths:
      - "budgeting/**"
      - "shared/**"
      - ".github/workflows/budgeting-tests.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "budgeting/**"
      - "shared/**"
      - ".github/workflows/budgeting-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test budgeting service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install shared module
        run: mvn --batch-mode --no-transfer-progress -f shared/pom.xml clean install

      - name: Verify budgeting service
        run: mvn --batch-mode --no-transfer-progress -f budgeting/pom.xml clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgeting-surefire-reports
          path: budgeting/target/surefire-reports/
          if-no-files-found: error

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgeting-failsafe-reports
          path: budgeting/target/failsafe-reports/
          if-no-files-found: error
