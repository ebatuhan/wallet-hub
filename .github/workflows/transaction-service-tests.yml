name: Transaction Service Tests

on:
  pull_request:
    paths:
      - "transaction-service/**"
      - "shared/**"
      - ".github/workflows/transaction-service-tests.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "transaction-service/**"
      - "shared/**"
      - ".github/workflows/transaction-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test transaction service
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install shared module
        run: mvn --batch-mode --no-transfer-progress -f shared/pom.xml clean install

      - name: Verify transaction service
        run: mvn --batch-mode --no-transfer-progress -f transaction-service/pom.xml clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-surefire-reports
          path: transaction-service/target/surefire-reports/
          if-no-files-found: error

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-failsafe-reports
          path: transaction-service/target/failsafe-reports/
          if-no-files-found: error
