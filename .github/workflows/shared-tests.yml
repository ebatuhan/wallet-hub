name: Shared Module Tests

on:
  pull_request:
    paths:
      - "shared/**"
      - ".github/workflows/shared-tests.yml"
      - "docs/test-plans/shared-test-plan.md"
      - "docs/test-reports/shared/**"
  push:
    branches:
      - dev
      - main
    paths:
      - "shared/**"
      - ".github/workflows/shared-tests.yml"
      - "docs/test-plans/shared-test-plan.md"
      - "docs/test-reports/shared/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test shared module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify shared module
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-surefire-reports
          path: shared/target/surefire-reports/
          if-no-files-found: error
