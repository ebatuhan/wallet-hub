name: AI Assistant Tests

on:
  pull_request:
    paths:
      - "services/ai-assistant-service/**"
      - "services/shared/**"
      - ".github/workflows/ai-assistant-service-tests.yml"
  push:
    branches:
      - dev
      - main
    paths:
      - "services/ai-assistant-service/**"
      - "services/shared/**"
      - ".github/workflows/ai-assistant-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ai-assistant-service service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install shared module
        run: mvn --batch-mode --no-transfer-progress -f services/shared/pom.xml clean install

      - name: Verify ai-assistant-service service
        run: mvn --batch-mode --no-transfer-progress -f services/ai-assistant-service/pom.xml clean verify

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-surefire-reports
          path: services/ai-assistant-service/target/surefire-reports/
          if-no-files-found: error

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-failsafe-reports
          path: services/ai-assistant-service/target/failsafe-reports/
          if-no-files-found: error
