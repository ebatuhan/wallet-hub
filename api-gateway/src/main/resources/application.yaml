spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: jsonplaceholder-route
          uri: https://jsonplaceholder.typicode.com
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: gateway
            client-secret: jvXTiFNeBf1latLmgesumfqeXWqqfYmi
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: http://localhost:8080/realms/keycloak-realm/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/keycloak-realm/protocol/openid-connect/certs

server:
  port: ${API_GATEWAY_PORT:8085}